<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Cradle Simulator - Momentum & Energy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .canvas-container {
            position: relative;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            background-color: #1e293b;
            cursor: grab;
        }
        
        canvas:active {
            cursor: grabbing;
        }

        .math-panel {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .math-section {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .math-section h3 {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .formula-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #34d399;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }

        .instructions {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Newton's Cradle Simulator</h1>
        <p class="instructions">Click and drag either the leftmost or rightmost bob to launch</p>
    </header>

    <div class="main-container">
        <!-- Interactive Canvas Area -->
        <div class="canvas-container">
            <canvas id="cradleCanvas" width="800" height="400"></canvas>
        </div>

        <!-- Live Math Proof Panel -->
        <div class="math-panel">
            <div class="math-section">
                <h3>1. Conservation of Linear Momentum (P)</h3>
                <div class="formula-display" id="momentumFormula">P_initial = P_final</div>
            </div>

            <div class="math-section">
                <h3>2. Conservation of Mechanical Energy (E)</h3>
                <div class="formula-display" id="energyFormula">E_total = KE + PE</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
